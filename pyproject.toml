[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dubai-planner"
version = "0.1.0"
description = "Evidence-aware local foundation for a Dubai AI travel planner"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.3", "langgraph==1.2.20", "streamlit==1.66.1", "tzdata==2026.6"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
dubai-data = "dubai_planner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dubai_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
